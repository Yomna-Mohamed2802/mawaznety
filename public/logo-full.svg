<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="120" y2="120">
      <stop offset="0%" stop-color="#102a43"/>
      <stop offset="100%" stop-color="#243b53"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="60" y2="60">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="60" y2="0">
      <stop offset="0%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#f0c75e"/>
    </linearGradient>
  </defs>

  <!-- Shield icon -->
  <g transform="translate(10, 10)">
    <path d="M50 5 L90 25 L90 55 Q90 80 50 95 Q10 80 10 55 L10 25 Z" fill="url(#bg2)"/>
    <path d="M50 9 L86 27 L86 55 Q86 77 50 91 Q14 77 14 55 L14 27 Z" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
    <path d="M30 22 Q50 12 70 22" fill="none" stroke="url(#accent2)" stroke-width="2" stroke-linecap="round"/>
    <!-- Meem letter -->
    <g transform="translate(50, 48)">
      <path d="M-16 -8 Q-16 -18 -6 -18 Q4 -18 4 -8 L4 12 Q4 18 0 18 Q-4 18 -4 12 L-4 -2 L-16 -2 Q-19 -2 -19 1 L-19 12 Q-19 18 -24 18" 
            fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Coin -->
    <circle cx="50" cy="75" r="10" fill="url(#gold2)" opacity="0.9"/>
    <text x="50" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#102a43">ج.م</text>
  </g>

  <!-- Text: موازنتي -->
  <text x="130" y="55" font-family="'IBM Plex Sans Arabic', Arial, sans-serif" font-size="32" font-weight="700" fill="#102a43" direction="rtl">موازنتي</text>

  <!-- Subtitle -->
  <text x="130" y="80" font-family="'IBM Plex Sans Arabic', Arial, sans-serif" font-size="12" fill="#627d98" direction="rtl">نظام موازنة المواطن 2026/2027</text>

  <!-- Accent line -->
  <rect x="130" y="90" width="60" height="3" rx="1.5" fill="url(#accent2)"/>
</svg>
