<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200">
      <stop offset="0%" stop-color="#102a43"/>
      <stop offset="100%" stop-color="#243b53"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="100" y2="0">
      <stop offset="0%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#f0c75e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Main shield shape -->
  <path d="M100 10 L180 50 L180 110 Q180 160 100 190 Q20 160 20 110 L20 50 Z" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Inner shield border -->
  <path d="M100 18 L172 54 L172 110 Q172 155 100 182 Q28 155 28 110 L28 54 Z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Decorative top arc -->
  <path d="M60 45 Q100 25 140 45" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Letter Meem (م) - stylized -->
  <g transform="translate(100, 95)">
    <!-- Main letter body -->
    <path d="M-30 -15 Q-30 -35 -10 -35 Q10 -35 10 -15 L10 25 Q10 35 0 35 Q-10 35 -10 25 L-10 -5 L-30 -5 Q-35 -5 -35 0 L-35 25 Q-35 35 -45 35" 
          fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Coin/budget symbol at bottom -->
  <circle cx="100" cy="150" r="18" fill="url(#gold)" opacity="0.9"/>
  <circle cx="100" cy="150" r="14" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="100" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#102a43">ج.م</text>

  <!-- Small decorative dots -->
  <circle cx="55" cy="130" r="3" fill="url(#accent)" opacity="0.6"/>
  <circle cx="145" cy="130" r="3" fill="url(#accent)" opacity="0.6"/>

  <!-- Bottom decorative line -->
  <line x1="60" y1="170" x2="140" y2="170" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" stroke-linecap="round"/>
</svg>
